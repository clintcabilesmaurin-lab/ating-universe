<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Star Glow Gradient -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Heart Glow Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic Disk -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#fcd34d" stroke-opacity="0.4" stroke-width="4" />

  <!-- Constellation Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-dasharray="6 8" stroke-width="1.5" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#fb7185" stroke-opacity="0.2" stroke-dasharray="4 6" stroke-width="1" />

  <!-- Pangilatan Mountain Silhouette -->
  <path d="M 60 410 Q 170 290 230 270 Q 256 260 280 275 Q 360 330 452 410 Z" fill="url(#mtnGrad)" stroke="#a5b4fc" stroke-opacity="0.3" stroke-width="1.5" />
  <path d="M 140 410 Q 210 330 256 315 Q 310 335 390 410 Z" fill="#1e1b4b" fill-opacity="0.7" />

  <!-- Background Tiny Stars -->
  <circle cx="120" cy="130" r="2.5" fill="#ffffff" opacity="0.8" />
  <circle cx="390" cy="120" r="2" fill="#ffffff" opacity="0.7" />
  <circle cx="90" cy="240" r="1.8" fill="#fde047" opacity="0.7" />
  <circle cx="420" cy="230" r="2.2" fill="#fde047" opacity="0.8" />
  <circle cx="200" cy="100" r="2" fill="#ffffff" opacity="0.6" />
  <circle cx="310" cy="90" r="2" fill="#ffffff" opacity="0.6" />

  <!-- Glowing Heart Core in Sky -->
  <g transform="translate(256, 175) scale(1.15)" filter="url(#softGlow)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="48" fill="url(#goldGlow)" opacity="0.6" />
    
    <!-- Heart Path -->
    <path d="M 0 -8 C -4 -28, -32 -28, -32 -4 C -32 16, 0 34, 0 42 C 0 34, 32 16, 32 -4 C 32 -28, 4 -28, 0 -8 Z" fill="url(#heartGrad)" />
    
    <!-- Heart Highlights -->
    <ellipse cx="-10" cy="-10" rx="6" ry="3" fill="#ffffff" opacity="0.4" transform="rotate(-30, -10, -10)" />
  </g>

  <!-- Constellation Connecting Filaments -->
  <line x1="120" y1="130" x2="225" y2="160" stroke="#fcd34d" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="390" y1="120" x2="287" y2="160" stroke="#fcd34d" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="256" y1="220" x2="256" y2="315" stroke="#a5b4fc" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- 4-Point Golden North Star Sparkle -->
  <g transform="translate(256, 70) scale(0.9)" filter="url(#softGlow)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#fef08a" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>
</svg>
